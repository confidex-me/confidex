<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confidex Sync API</title>
  <link rel="stylesheet" href="/v1/swagger-ui/5.34.1/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; font-family: system-ui, sans-serif; }
    .swagger-ui .wrapper { max-width: 1120px; padding: 0 24px; }
    .swagger-ui .info { margin: 32px 0 24px; }
    .swagger-ui .info .title { font-size: 32px; line-height: 1.25; }
    .swagger-ui .info .description p { max-width: 90ch; margin-left: 0; margin-right: 0; line-height: 1.55; }
    .swagger-ui .scheme-container { margin: 0 0 24px; padding: 16px 0; box-shadow: none; border-block: 1px solid #e5e7eb; }
    .swagger-ui .opblock-tag { padding: 16px 0; font-size: 20px; }
    .swagger-ui .json-schema-2020-12-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .swagger-ui .json-schema-2020-12-accordion,
    .swagger-ui .json-schema-2020-12-expand-deep-button { appearance: none; display: inline-flex; align-items: center; gap: 4px; margin: 0; padding: 4px; border: 0; background: transparent; color: #475569; line-height: 1.25; cursor: pointer; }
    .swagger-ui .json-schema-2020-12-accordion:focus-visible,
    .swagger-ui .json-schema-2020-12-expand-deep-button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; border-radius: 3px; }
    @media (max-width: 600px) {
      .swagger-ui .wrapper { padding: 0 16px; }
      .swagger-ui .info .title { font-size: 26px; }
      .swagger-ui .opblock .opblock-summary-control { flex-wrap: wrap; gap: 6px; }
      .swagger-ui .opblock .opblock-summary-description { flex-basis: 100%; padding: 4px 0; }
    }
  </style>
</head>
<body>
  <noscript><p><a href="/v1/openapi.json">OpenAPI JSON</a></p></noscript>
  <div id="swagger-ui"></div>
  <script src="/v1/swagger-ui/5.34.1/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "/v1/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      validatorUrl: null
    });
  </script>
</body>
</html>
