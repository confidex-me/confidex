[package]
name = "confidexsyncd"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"
repository = "https://github.com/confidex-me/confidex"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
confidex-vault = { path = "../../crates/confidex-vault" }
bytes = "1"
http = "1"
futures-util = "0.3"
multer = "=3.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "=1.29.1", default-features = false, features = ["v5"] }
hex = "0.4"
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
toml = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
wasm-bindgen = "=0.2.130"
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto", "wasm_bindgen"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
tower = { version = "0.5", features = ["util"] }
