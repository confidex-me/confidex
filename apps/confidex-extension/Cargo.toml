[package]
name = "confidex-extension"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The UI and session WASM bundles are built separately and both need browser entropy.
ui = ["dep:confidex-browser", "dep:confidex-ui", "dep:confidex-vault", "dep:eframe", "dep:web-sys"]
session = ["dep:confidex-browser", "dep:confidex-vault"]

[dependencies]
confidex-extension-content = { path = "content" }
confidex-app = { path = "../../crates/confidex-app" }
confidex-storage = { path = "../../crates/confidex-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
confidex-browser = { path = "../../crates/confidex-browser", optional = true }
confidex-vault = { path = "../../crates/confidex-vault", features = ["browser"], optional = true }
confidex-ui = { path = "../../crates/confidex-ui", default-features = false, optional = true }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"], optional = true }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["HtmlCanvasElement", "Navigator", "Window"], optional = true }
