<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confidex</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="session.css">
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup-boot.js"></script>
</head>
<body>
<div id="startup" role="status" aria-live="polite">
<p id="startup-message">Confidex</p>
<pre id="startup-detail" hidden></pre>
<button id="startup-reload" type="button" hidden>↻</button>
</div>
<div id="site-permissions" hidden>
<button id="site-permissions-toggle" type="button" aria-describedby="site-permissions-status"></button>
<span id="site-permissions-status" role="status"></span>
</div>
<canvas id="session" aria-label="Confidex"></canvas>
</body>
</html>
