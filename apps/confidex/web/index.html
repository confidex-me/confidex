<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confidex</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; color-scheme: light dark; background: Canvas; color: CanvasText; }
canvas { display: block; width: 100%; height: 100%; }
#loading { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; overflow: auto; background: Canvas; font: 16px/1.5 system-ui; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
.spinner { width: 40px; height: 40px; flex-shrink: 0; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: pulse 1600ms cubic-bezier(.77, 0, .175, 1) infinite; } }
</style>
<body><div id="loading" role="status" aria-atomic="true"><span class="spinner" aria-hidden="true"></span><span>Loading Confidex…</span></div><canvas id="app" aria-label="Confidex"></canvas>
<script type="module" src="/boot.js"></script></body></html>
