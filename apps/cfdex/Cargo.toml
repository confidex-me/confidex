[package]
name = "cfdex"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"
repository = "https://github.com/confidex-me/confidex"

[features]
default = ["sync"]
sync = ["confidex-native/sync"]

[dependencies]
confidex-app = { path = "../../crates/confidex-app" }
confidex-native = { path = "../../crates/confidex-native" }
confidex-storage = { path = "../../crates/confidex-storage" }
confidex-vault = { path = "../../crates/confidex-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
interprocess = "=2.4.7"
clap = { version = "4", features = ["derive"] }
sha2 = "=0.11.1"
tempfile = "3"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
confidexsyncd = { path = "../confidexsyncd" }
