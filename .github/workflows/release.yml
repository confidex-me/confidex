name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}
  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', github.event.release.tag_name) }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/releases
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 builders/release/upload.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Deploy browser app and sync Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 builders/cloudflare/deploy.py

  containers:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', github.event.release.tag_name) }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/releases
          merge-multiple: true
      - id: context
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 builders/containers/prepare.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/containers/syncd
          file: builders/containers/Dockerfile.syncd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.context.outputs.namespace }}/confidexsyncd:${{ github.event.release.tag_name }}
            ${{ steps.context.outputs.namespace }}/confidexsyncd:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.context.outputs.version }}
            org.opencontainers.image.revision=${{ steps.context.outputs.commit }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/containers/web
          file: builders/containers/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.context.outputs.namespace }}/confidex-web:${{ github.event.release.tag_name }}
            ${{ steps.context.outputs.namespace }}/confidex-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.context.outputs.version }}
            org.opencontainers.image.revision=${{ steps.context.outputs.commit }}
