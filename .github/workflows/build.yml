name: Build
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RELEASE_VERSION: ${{ inputs.release-tag }}
jobs:
  checks:
    if: ${{ inputs.release-tag == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux test dependencies
        timeout-minutes: 5
        run: sudo python3 builders/linux/ci_dependencies.py
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
        timeout-minutes: 60
      - run: python3 -m unittest discover -s builders -p 'test_*.py'
      - run: node --test apps/confidex/web/*.test.mjs
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: amd64
          - runner: windows-2022
            platform: windows
            arch: amd64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: builders/windows/global.json
      - if: ${{ inputs.release-tag == '' }}
        run: cargo test --locked --workspace
        timeout-minutes: 60
        env:
          # RustCrypto cannot detect ARM crypto instructions on Windows.
          RUSTFLAGS: ${{ matrix.platform == 'windows' && matrix.arch == 'arm64' && '-C target-cpu=native' || '' }}
      - if: ${{ inputs.release-tag == '' }}
        run: cargo check --locked -p confidex --no-default-features
      - if: ${{ inputs.release-tag == '' }}
        run: cargo check --locked -p cfdex --no-default-features
      - run: python builders/${{ matrix.platform }}/build.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            libc: gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            libc: gnu
          - runner: ubuntu-24.04
            arch: amd64
            libc: musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            libc: musl
    runs-on: ${{ matrix.runner }}
    env:
      CONFIDEX_LIBC: ${{ matrix.libc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 builders/linux/build.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 builders/wasm/build.py
      - if: ${{ inputs.release-tag == '' }}
        run: node apps/confidex/web/check.mjs /usr/bin/google-chrome dist/web
      - if: ${{ inputs.release-tag == '' }}
        run: node apps/confidex/web/input-check.mjs /usr/bin/google-chrome dist/wasm
      - if: ${{ inputs.release-tag == '' }}
        run: node apps/confidex/web/storage-check.mjs /usr/bin/google-chrome
      - run: npx wrangler deploy --dry-run --config apps/confidex/wrangler.toml
      - run: python3 builders/syncd/build.py
      - run: npx wrangler deploy --dry-run --config apps/confidexsyncd/wrangler.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7
  bundle:
    needs: [checks, native, linux, web]
    if: >-
      ${{ !cancelled() &&
          needs.native.result == 'success' &&
          needs.linux.result == 'success' &&
          needs.web.result == 'success' &&
          (needs.checks.result == 'success' ||
           (inputs.release-tag != '' && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/releases
          pattern: '{native-*,web}'
          merge-multiple: true
      - run: python3 builders/selfhost/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost
          path: dist/releases/*selfhost*.zip
          if-no-files-found: error
          retention-days: 7
