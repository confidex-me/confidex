[package]
name = "confidex-vault"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"
repository = "https://github.com/confidex-me/confidex"

[features]
browser = ["getrandom/wasm_js"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["rng", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize", "pem"] }
flate2 = { version = "1.1.11", default-features = false, features = ["miniz_oxide"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
rmp = "0.8"
rmpv = "1.3.1"
png = { version = "=0.18.1", default-features = false }
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent"] }
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
crc32fast = "1.5.0"
qrcodegen-no-heap = "=1.8.1"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["alloc", "ed25519", "p256", "encryption"] }
ssh-encoding = { version = "0.3.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
sha1 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = { version = "1.8.2", features = ["alloc"] }

[dev-dependencies]
quircs = "0.10.3"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.4.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", optional = true }
